<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0d14">
<title>CrowdSynth</title>
<style>
  :root { color-scheme: dark; --c:#7c5cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0b0d14; color:#fff; font:17px/1.35 system-ui,sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; min-height:100dvh; user-select:none; -webkit-user-select:none; }
  header { padding:10px 14px; display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#aab0c6; }
  #dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#ffb020; margin-right:6px; } #dot.ok { background:#2ecc8f; } #dot.bad { background:#ff4d6d; }
  #pad { flex:1; margin:8px 14px; border-radius:24px; background:var(--c); touch-action:none; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; position:relative; overflow:hidden; transition:background .3s, filter .15s; min-height:240px; }
  #pad.off { filter:grayscale(.8) brightness(.55); } #pad.press { filter:brightness(1.25); }
  #role { font-size:40px; font-weight:800; } #instr { margin-top:8px; font-size:19px; opacity:.95; } #sub { margin-top:6px; font-size:14px; opacity:.8; }
  #ack { position:absolute; bottom:14px; left:0; right:0; font-size:13px; opacity:0; transition:opacity .3s; } #ack.show { opacity:.9; }
  footer { padding:10px 14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; color:#aab0c6; }
  #motion { min-height:48px; padding:0 16px; border:0; border-radius:12px; background:#2a3047; color:#fff; font:inherit; }
  .ring { position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; background:rgba(255,255,255,.55); animation:ring .45s ease-out forwards; pointer-events:none; }
  @keyframes ring { to { transform:scale(2.6); opacity:0; } } @media (prefers-reduced-motion:reduce) { .ring { animation:none; opacity:0; } }
</style></head><body>
<header><span><span id="dot"></span><span id="conn">Connecting</span></span><span id="alias"></span></header>
<div id="pad" class="off">
  <div id="role">CrowdSynth</div><div id="instr">Joining...</div><div id="sub"></div><div id="ack"></div>
</div>
<footer><span id="round">Waiting for the host</span><button id="motion" hidden>Enable shake</button></footer>
<script src="/play.js"></script>
</body></html>
